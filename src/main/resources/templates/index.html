<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | FilmBro</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="images/logo_fully_white_background.png">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .hero {
        background-image: url('/images/dylan-freedom-hYkWbfpxYs8-unsplash.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        background-color: #000;
    }

    .hero h2 {
        font-size: 3rem;
    }

    @keyframes preload {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    .hero {
        animation: preload 1s ease-in-out;
    }

</style>

<body style="background-color: #2C1E1A">

<!-- Navbar -->
<nav class="navbar">
    <!-- Brand -->
    <div class="navbar-brand">
        <a class="navbar-brand me-auto custom-logo" href="/index">FilmBro</a>
    </div>

    <!-- Search Section -->
    <div class="profile-icon-container">
        <!-- Search Icon -->
        <i class="bi bi-search search-icon" data-bs-toggle="collapse" data-bs-target="#searchContainer"></i>
    </div>

    <div class="text-end ms-2 profile-icon-position d-flex align-items-center" id="navcol-2">
        <a href="/login" class="btn btn-primary me-2 button-style">Log in</a>
        <a href="/register" class="btn btn-primary button-style">Register</a>
    </div>
</nav>

<div class="hero">
    <h2>Unleash Your Inner Cinephile</h2>
</div>

<!-- Footer -->
<div class="mt-auto" style="margin-top: 4%;">
    <footer class="text-center custom-footer footer-line space-up">
        <div class="container text-muted py-3 py-lg-4">
            <p class="mb-0 letters-color">Powered by <a class="custom-link" href="/index">FilmBro</a> | &copy; 2025 All Rights Reserved</p>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
