<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | FilmBro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
    <div class="container-fluid container-custom">
        <div class="row space1">
            <!-- Left Section -->
            <div class="col-6 col-md-5 col-lg-6 space custom-col-6">
                <div class="justify-content-center align-items-start gap-4 vh-50 space-form-text costume-width photo-position">
                    <!-- Profile Photo -->
                    <img th:src="${user.profile_pic}"
                         alt="Profile Picture"
                         class="text-center text-white bg-secondary d-flex justify-content-center align-items-center rounded-circle mb-3 photo-width">
                    <div class="d-flex flex-column align-items-centergap-1 custom-position">
                        <!-- Profile Name and Buttons -->
                        <h1 class="text-warning mb-3 username-style" th:text="${user.user_name}"></h1>

                        <!-- Bio -->
                        <p class="bio" th:text="${user.bio}"></p>

                        <!-- Country -->
                        <p class="country"><b>Country:</b> <span th:text="${user.country}"></span></p>

                        <!-- Followers and Following Buttons -->
<!--                        <div class="follow-buttons">-->
<!--                            <button class="btn" onclick="showFollowersPopup()">-->
<!--                                Followers <span th:text="${user.followersCount}"></span>-->
<!--                            </button>-->
<!--                            <button class="btn" onclick="showFollowingPopup()">-->
<!--                                Following <span th:text="${user.followingCount}"></span>-->
<!--                            </button>-->
<!--                        </div>-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
