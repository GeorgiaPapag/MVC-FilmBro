<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | FilmBro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>
<style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .container {
        flex: 1;  /* This will take up the remaining space */
    }

    footer {
        margin-top: auto;  /* Push footer to the bottom */
    }
</style>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <!-- Brand -->
        <div class="navbar-brand">
            <a class="navbar-brand me-auto custom-logo" href="/index">FilmBro</a>
        </div>

        <!-- Search Section -->
        <div class="profile-icon-container">
            <!-- Search Icon -->
            <i class="bi bi-search search-icon" data-bs-toggle="collapse" data-bs-target="#searchContainer"></i>
        </div>

        <div class="dropdown text-end ms-2 profile-icon-position">
            <a href="#" class="d-block text-decoration-none dropdown-toggle custom-brand" data-bs-toggle="dropdown">
                <img id="profilePic" th:src="${user.profilePic != null ? user.profilePic : '/images/Default-Profile2.jpg'}" alt="Profile Picture" class="rounded-circle">
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item" th:href="@{/profile(id=${user.userId})}">
                        <i class="bi bi-person-fill"></i> Profile
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" th:href="@{/index}">
                        <i class="bi bi-box-arrow-left"></i> Sign out
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid container-custom">
        <div class="row space1">
            <!-- Left Section -->
            <div class="col-6 col-md-5 col-lg-6 space custom-col-6">
                <div class="justify-content-center align-items-start gap-4 vh-50 space-form-text costume-width photo-position">
                    <!-- Profile Photo -->
                    <img th:src="${user.profilePic != null ? user.profilePic : '/images/Default-Profile2.jpg'}"
                         alt="Profile Picture"
                         class="text-center text-white bg-secondary d-flex justify-content-center align-items-center rounded-circle mb-3 photo-width">
                    <div class="d-flex flex-column align-items-center gap-1 custom-position">
                        <!-- Profile Name and Buttons -->
                        <h1 class=" text-warning mb-3 username-style">
                            <b th:text="${user.userName}"></b>
                        </h1>

                        <!-- Edit Profile or Follow Button -->
                        <div class="d-flex gap-2 mt-2 custom-width">
                            <a th:href="@{/editmyprofile}" class="btn btn-sm edit-button-style">Edit Profile</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Section -->
            <div class="col-6 space custom-col-lg-6 custom-col-6">
                <div class="card custom-card">
                    <div class="card-body custom-card-body">
                        <p class="mb-0" th:text="${user.bio}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Options Section -->
        <div class="container-fluid custom-border m-0 p-0">
            <div class="d-flex justify-content-center gap-2 py-3 space2">
                    <button class="btn custom-btn-3 list-buttons" onclick="redirectToDefaultList('Seen')">Seen</button>
                    <button class="btn custom-btn-3 list-buttons" onclick="redirectToDefaultList('Favorites')">Favorites</button>
                    <button class="btn custom-btn-3 list-buttons" onclick="redirectToDefaultList('Watchlist')">Watchlist</button>
                    <button id="reviewsButton" class="btn custom-btn-3 list-buttons">My Reviews</button>
                    <button id="movieListsButton" class="btn custom-btn-3 list-buttons">My Movie Lists</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-auto" style="margin-top: 4%;"></div>
    <footer class="text-center custom-footer footer-line space-up">
        <div class="container text-muted py-3 py-lg-4">
            <p class="mb-0 letters-color">Powered by <a class="custom-link" href="/index">FilmBro</a> | &copy; 2025 All Rights Reserved</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle (This is required for dropdowns to work) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
