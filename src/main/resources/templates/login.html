<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FilmBro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .hero {
        background-image: url('/images/dylan-freedom-hYkWbfpxYs8-unsplash.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        background-color: #000;
    }

    .hero h2 {
        font-size: 3rem;
    }

    @keyframes preload {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    .hero {
        animation: preload 1s ease-in-out;
    }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .container {
        flex: 1;  /* This will take up the remaining space */
    }

    footer {
        margin-top: auto;  /* Push footer to the bottom */
    }

</style>

<body style="background-color: #2C1E1A">

<!-- Navbar -->
<nav class="navbar">
    <!-- Brand -->
    <div class="navbar-brand">
        <a class="navbar-brand me-auto custom-logo" href="/index">FilmBro</a>
    </div>

    <!-- Search Section -->
    <div class="profile-icon-container">
        <!-- Search Icon -->
        <i class="bi bi-search search-icon" data-bs-toggle="collapse" data-bs-target="#searchContainer"></i>
    </div>

    <div class="text-end ms-2 profile-icon-position d-flex align-items-center" id="navcol-2">
        <a href="#" class="btn btn-primary me-2 button-style" id="loginButton">Log in</a>
        <a href="#" class="btn btn-primary button-style" id="registerButton">Register</a>
    </div>
</nav>

<div class="hero">
    <h2>Unleash Your Inner Cinephile</h2>
</div>

<!-- Login Modal -->
<div class="modal fade effect" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm width-form-style width-form-style-effect width-form-style-500px">
        <div class="modal-content general-form-style">
            <!-- Modal Header -->
            <div class="modal-header header-form-style">
                <h5 class="modal-title header-title-form-style" id="loginModalLabel">Log In</h5>
                <button type="button" class="btn-close form-close-button-style" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body form-body-style">
                <form action="/loginController" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-custom-style" id="username"
                               placeholder="Enter your username" minlength="5" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom-style" id="password"
                               placeholder="Enter your password" minlength="5" required>
                    </div>
                    <button type="submit" class="btn btn-primary button-style">Log In</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Register Modal -->
<div class="modal fade effect" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm width-form-style width-form-style-effect width-form-style-500px">
        <div class="modal-content general-form-style">
            <!-- Modal Header-->
            <div class="modal-header header-form-style">
                <h5 class="modal-title header-title-form-style" id="registerModalLabel">Register</h5>
                <button type="button" class="btn-close form-close-button-style" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!--Modal Body-->
            <div class="modal-body form-body-style">
                <form id="profileForm" action="registerController.jsp" method="post">
                    <!--username-->
                    <div class="mb-3">
                        <label for="registerUsername" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-custom-style" id="registerUsername" placeholder="Enter your username"
                               name="username"
                               minlength="5"
                               required
                               pattern="^\S+$"
                               title="Username cannot contain spaces." >
                    </div>
                    <!--email-->
                    <div class="mb-3">
                        <label for="registerEmail" class="form-label">Email</label>
                        <input type="email" name="userEmail" class="form-control form-control-custom-style" id="registerEmail" placeholder="Enter your email"
                               required
                               pattern="^\S+$"
                               title="Email cannot contain spaces.">
                    </div>
                    <!--password-->
                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-custom-style" id="registerPassword" placeholder="Enter your password"
                               name="password"
                               minlength="5"
                               required
                               pattern="^\S+$"
                               title="Username cannot contain spaces.">
                    </div>
                    <!--confirm-->
                    <div class="mb-3">
                        <label for="registerConfirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control form-control-custom-style" id="registerConfirmPassword" placeholder="Confirm your password"
                               name="confirm"
                               minlength="5"
                               required
                               pattern="^\S+$"
                               title="Username cannot contain spaces.">
                    </div>

                    <!-- Private-Public Options -->
                    <div class="select-option">
                        <label class="form-label">I want my profile to be:</label>
                        <div class="option-container">
                            <!-- Private option -->
                            <label class="option option-custom-style" tabindex="0" role="button" data-bs-toggle="popover" data-bs-placement="bottom" data-bs-trigger="hover"  data-bs-content="Only your followers can see your lists, reviews, and followers. You can change your profile visibility later.">
                                <input type="checkbox" name="option" value="private" class="option-checkbox custom-checkbox">
                                Private
                            </label>

                            <!-- Public option -->
                            <label class="option option-custom-style" tabindex="0" role="button" data-bs-toggle="popover" data-bs-placement="bottom" data-bs-trigger="hover" data-bs-content="ALL users can see your lists, reviews, and followers. You can change your profile visibility later.">
                                <input type="checkbox" name="option" value="public" class="option-checkbox custom-checkbox">
                                Public
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary button-style">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="mt-auto" style="margin-top: 4%;"></div>
<footer class="text-center custom-footer footer-line space-up">
    <div class="container text-muted py-3 py-lg-4">
        <p class="mb-0 letters-color">Powered by <a class="custom-link" href="/index">FilmBro</a> | &copy; 2025 All Rights Reserved</p>
    </div>
</footer>

<!-- Bootstrap JS (include it at the bottom of the page) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Open the login modal when the "Log in" button is clicked
    document.getElementById('loginButton').addEventListener('click', function() {
        var myModal = new bootstrap.Modal(document.getElementById('loginModal'), {
            keyboard: false
        });
        myModal.show();  // This will open the login modal
    });

    // Open the register modal when the "Register" button is clicked
    document.getElementById('registerButton').addEventListener('click', function() {
        var myModal = new bootstrap.Modal(document.getElementById('registerModal'), {
            keyboard: false
        });
        myModal.show();  // This will open the register modal
    });
</script>

</body>
</html>
