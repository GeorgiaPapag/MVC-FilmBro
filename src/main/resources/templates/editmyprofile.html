<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | FilmBro</title><!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/forms_css.css" rel="stylesheet">
    <link href="/css/general.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>

<style>
    :root {
        --header-height: 60px;
        --footer-height: 30px;
    }

    /* Background Image */
    .background {
        background-image: url('/images/dylan-freedom-hYkWbfpxYs8-unsplash.jpg');
        background-size: cover;
        background-position: top center;
        flex-grow: 1;
        flex-shrink: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: calc(100vh - var(--header-height) - var(--footer-height));
        overflow: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .container {
        flex: 1;  /* This will take up the remaining space */
    }

    footer {
        margin-top: auto;  /* Push footer to the bottom */
    }
</style>

<body>
<!-- Navbar -->
<nav class="navbar">
    <!-- Brand -->
    <div class="navbar-brand">
        <a class="navbar-brand me-auto custom-logo" href="/index">FilmBro</a>
    </div>

    <!-- Search Section -->
    <div class="profile-icon-container">
        <!-- Search Icon -->
        <i class="bi bi-search search-icon" data-bs-toggle="collapse" data-bs-target="#searchContainer"></i>
    </div>

    <div class="dropdown text-end ms-2 profile-icon-position">
        <a href="#" class="d-block text-decoration-none dropdown-toggle custom-brand" data-bs-toggle="dropdown">
            <img th:src="${user.profilePic}" alt="Profile" class="rounded-circle">
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
            <li>
                <a class="dropdown-item" th:href="@{/profile(id=${user.userId})}">
                    <i class="bi bi-person-fill"></i> Profile
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" th:href="@{/index}">
                    <i class="bi bi-box-arrow-left"></i> Sign out
                </a>
            </li>
        </ul>
    </div>
</nav>

<div class="background">

</div>






<!-- Footer -->
<div class="mt-auto" style="margin-top: 4%;"></div>
<footer class="text-center custom-footer footer-line space-up">
    <div class="container text-muted py-3 py-lg-4">
        <p class="mb-0 letters-color">Powered by <a class="custom-link" href="/index">FilmBro</a> | &copy; 2025 All Rights Reserved</p>
    </div>
</footer>
</body>
</html>
