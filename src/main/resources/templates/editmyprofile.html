                    <div class="mb-3 position-relative">
                        <label for="name" class="form-label">Username:</label>

                        <!-- Pen Icon Above the Input -->
                        <span id="editIcon" class="position-absolute"
                              style="top: 0; right: 10px; cursor: pointer; font-size: 1.2em;">
                            &#9998; <!-- Unicode Pen Icon -->
                        </span>

                        <!-- Username Input Field -->
                        <input type="text" class="form-control form-control-custom-style"
                               id="name" name="name"
                               th:value="${user.userName}"
                               minlength="5" maxlength="30" placeholder="My username"
                               readonly required>
                    </div>

                    <!-- Email Input Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control form-control-custom-style" minlength="5" required id="email"
                               name="userEmail" th:value="${user.email}"  placeholder="My email"
                               title="Email must contain at least one number and can only include letters, numbers, '@', and '.'">
                    </div>

                    <!-- Country Dropdown -->
                    <div class="mb-3 mb-3-custom">
                        <label id="country" class="form-label">Country:</label>
                        <div class="dropdown dropdown-custom">
                            <button class="btn btn-primary dropdown-toggle dropdown-button-custome-style" type="button"
                                    id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                <!-- Show selected country name or default message -->
                                <span id="selectedCountryName" th:text="${selectedCountryName != null ? selectedCountryName : 'Choose a Country'}"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-custom dropdown-item-custom-2"
                                aria-labelledby="dropdownMenuButton" id="countryDropdown">
                                <!-- Loop over countries and display them -->
                                <li th:each="country : ${countries}">
                                    <button class="dropdown-item" type="button"
                                            th:data-id="${country.code}"
                                            th:classappend="${selectedCountry != null && selectedCountry == country.code ? 'selected' : ''}">
<!--                                            onclick="updateCountryName('${country.name}')">-->
                                        <img th:src="@{'https://flagcdn.com/w40/' + ${country.code.toLowerCase()} + '.png'}"
                                             alt="Flag" style="width: 20px; height: 14px; margin-right: 10px;">
                                        <span th:text="${country.name}"></span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!--Info-->
                    <div class="mb-3">
                        <label for="info" class="form-label">Information about me: </label>
                        <textarea class="form-control form-control-custom-style textarea-custom-style" id="info" name = "info" rows="5" maxlength="1000" th:text="${user.bio}"></textarea>
                    </div>

                    <!-- Private-Public Options -->
                    <div class="select-option">
                        <label class="form-label form-label-custom">I want my profile to be:</label>
                        <div class="option-container">
                            <!-- Private option -->
                            <label class="option option-custom-style" tabindex="0" role="button"
                                   data-bs-toggle="popover" data-bs-placement="bottom"
                                   data-bs-trigger="hover" data-bs-content="Only your followers can see your lists, reviews, and followers.">
                                <input type="radio" name="profileVisibility" value="0" class="option-radio"
                                       th:checked="${user.accountStatus == 0}">
                                Private
                            </label>

                            <!-- Public option -->
                            <label class="option option-custom-style" tabindex="0" role="button"
                                   data-bs-toggle="popover" data-bs-placement="bottom"
                                   data-bs-trigger="hover" data-bs-content="ALL users can see your lists, reviews, and followers.">
                                <input type="radio" name="profileVisibility" value="1" class="option-radio"
                                       th:checked="${user.accountStatus == 1}">
                                Public
                            </label>
                        </div>
                    </div>


                    <div class="d-flex justify-content">

                        <button type="button" class="btn btn-secondary button-style button-style-edit" th:onclick="|window.location.href = '/profile?id=${user.userId}'|">Cancel</button>

<script>
    const selectedCountryInput = document.getElementById('selectedCountry');
    const streamingButton = document.getElementById("streamingDropdown");

    // Enable or disable the Watch Providers button based on the selected country
    if (selectedCountryInput.value) {
        streamingButton.style.pointerEvents = "auto";
        streamingButton.style.opacity = "1";
        fetchWatchProviders(selectedCountryInput.value);
    } else {
        streamingButton.style.pointerEvents = "none";
        streamingButton.style.opacity = "0.5";
    }

    // Handle country dropdown selection
    document.querySelectorAll('#countryDropdown .dropdown-item').forEach(item => {
        item.addEventListener('click', function (e) {
            e.preventDefault();

            const selectedCountryName = this.textContent.trim();
            const countryId = this.getAttribute('data-id');

            // Update the dropdown button text
            document.getElementById('dropdownMenuButton').textContent = selectedCountryName;

            // Set the hidden input value to the selected country's ID
            selectedCountryInput.value = countryId;

            // Enable the Watch Providers button
            streamingButton.style.pointerEvents = "auto";
            streamingButton.style.opacity = "1";

            // Fetch watch providers for the selected country
            fetchWatchProviders(countryId);
        });
    });

    function fetchWatchProviders(countryId) {
        const streamingDropdownMenu = document.getElementById("streamingDropdownMenu");

        if (!countryId) {
            streamingDropdownMenu.innerHTML = "<p>Please select a country first.</p>";
            return;
        }

        streamingDropdownMenu.innerHTML = "<p>Loading watch providers...</p>";

        // Make the API call to get watch providers (adjust the endpoint as needed)
        fetch(`/getWatchProviders?country=${countryId}`)
            .then(response => response.json())
            .then(data => populateWatchProviders(streamingDropdownMenu, data))
            .catch(error => {
                streamingDropdownMenu.innerHTML = `<p>Error loading watch providers: ${error.message}</p>`;
            });
    }

    function populateWatchProviders(menu, providers) {
        menu.innerHTML = "";
        if (providers && providers.length > 0) {
            providers.forEach(provider => {
                const listItem = document.createElement("li");
                const div = document.createElement("div");
                div.className = "form-check custom-checkbox-add";

                const checkbox = document.createElement("input");
                checkbox.className = "form-check-input";
                checkbox.type = "checkbox";
                checkbox.id = provider.id;
                checkbox.name = "movieServices[" + provider.name + "]";
                checkbox.value = "on";

                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = "movieServices[" + provider.name + "]";
                hiddenInput.value = "off";

                const logoImg = document.createElement("img");
                logoImg.src = `https://image.tmdb.org/t/p/w45${provider.logo_path}`;
                logoImg.alt = provider.name + " Logo";
                logoImg.classList.add("logo-img");

                const label = document.createElement("label");
                label.className = "form-check-label custom-checkbox-style";
                label.htmlFor = provider.id;
                label.textContent = provider.name;

                div.appendChild(checkbox);
                div.appendChild(hiddenInput);
                div.appendChild(logoImg);
                div.appendChild(label);
                listItem.appendChild(div);
                menu.appendChild(listItem);
            });
        } else {
            menu.innerHTML = "<p>No watch providers available</p>";
        }
    }
</script>

<script>
    // Get references to the input field and the edit icon
    const usernameField = document.getElementById("name");
    const editIcon = document.getElementById("editIcon");

    // Add click event to the pen icon
    editIcon.addEventListener("click", () => {
        // Enable the input field for editing
        usernameField.removeAttribute("readonly");
        usernameField.focus(); // Automatically focus on the field

        // Hide the pen icon
        editIcon.style.display = "none";
    });
</script>

<script>
    // Avatar Popup
    function selectAvatar(avatarSrc) {
        // Update the hidden input with the selected avatar's URL
        const avatarInput = document.getElementById("avatarUrl");
        if (avatarInput) {
            avatarInput.value = avatarSrc;  // Set the selected avatar URL here
        }

        // Update the displayed profile picture
        const profilePic = document.getElementById("profilePhoto");
        if (profilePic) {
            profilePic.src = avatarSrc;  // Change the image source to the new avatar
        }

        // Close the popup
        closeAvatarPopup();
    }

    function closeAvatarPopup() {
        // Hide the avatar popup by setting the display to "none"
        const avatarPopup = document.getElementById("avatarPopup");
        if (avatarPopup) {
            avatarPopup.style.display = "none";
        }
    }

    function showAvatarPopup() {
        // Show the avatar popup by setting the display to "flex"
        const avatarPopup = document.getElementById("avatarPopup");
        if (avatarPopup) {
            avatarPopup.style.display = "flex";
        }
    }

    // Close avatar popup when clicking outside of it
    window.addEventListener("click", function (event) {
        const avatarPopup = document.getElementById("avatarPopup");
        if (avatarPopup && event.target === avatarPopup) {
            closeAvatarPopup();
        }
    });
</script>

<!--for public private-->
<script>
    // Initialize Bootstrap popovers
    document.addEventListener('DOMContentLoaded', function () {
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        popoverTriggerList.forEach(function (popoverTriggerEl) {
            new bootstrap.Popover(popoverTriggerEl);
        });
    });

    // Ensure only one checkbox is selected at a time (Private or Public)
    const checkboxes = document.querySelectorAll('.option-checkbox');

    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            if (this.checked) {
                checkboxes.forEach(otherCheckbox => {
                    if (otherCheckbox !== this) {
                        otherCheckbox.checked = false; // Uncheck the other checkbox
                    }
                });
            }
        });
    });
</script>
